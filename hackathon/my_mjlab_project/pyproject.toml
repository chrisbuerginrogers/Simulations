[project]
name = "my-mjlab-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris", email = "crogers@tufts.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "mjlab>=1.5.0",
]

[project.scripts]
my-mjlab-project = "my_mjlab_project:main"

[project.entry-points."mjlab.tasks"]
my_mjlab_project = "my_mjlab_project"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
]
