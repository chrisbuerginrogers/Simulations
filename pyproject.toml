[project]
name = "mycode"
version = "0.1.0"
description = "Shared MuJoCo/mjlab experiments: FallingBall, pendulum, ur3e reach"
requires-python = ">=3.14"
dependencies = [
    "mjlab==1.5.0",
    "mujoco==3.10.0",
    "mujoco-warp==3.10.0.1",
    "torch==2.12.1",
    "warp-lang==1.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
]
